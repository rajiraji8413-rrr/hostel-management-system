
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between mb-4">
        <h2>Student Management</h2>
        <a href="/api/dashboard-page/" class="btn btn-secondary">Dashboard</a>
    </div>

    <div class="card p-4 mb-4">
        <h5 id="formTitle">Add Student</h5>

        <form id="studentForm">
            <input type="hidden" id="studentId">

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Student Name</label>
                    <input type="text" id="studentName" class="form-control" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Email</label>
                    <input type="email" id="email" class="form-control" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Phone</label>
                    <input type="text" id="phone" class="form-control" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Department</label>
                    <input type="text" id="department" class="form-control" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Year of Study</label>
                    <input type="number" id="yearOfStudy" class="form-control" min="1" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" id="saveButton">Save Student</button>
            <button type="button" class="btn btn-secondary" onclick="resetForm()">Clear</button>
        </form>

        <div id="message" class="mt-3"></div>
    </div>

    <div class="card p-4">
        <h5>Student List</h5>

        <div class="table-responsive">
            <table class="table table-bordered table-striped mt-3">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Department</th>
                        <th>Year</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="studentTable"></tbody>
            </table>
        </div>
    </div>

</div>

<script>
const API_URL = "/api/students/";

function getCSRFToken() {
    const cookie = document.cookie
        .split("; ")
        .find(row => row.startsWith("csrftoken="));

    return cookie ? cookie.split("=")[1] : "";
}

function showMessage(message, type = "success") {
    document.getElementById("message").textContent = message;
    document.getElementById("message").className = `alert alert-${type} mt-3`;
}

async function loadStudents() {
    const response = await fetch(API_URL, {
        credentials: "same-origin"
    });

    if (!response.ok) {
        showMessage("Unable to load students. Please log in through Admin.", "danger");
        return;
    }

    const students = await response.json();
    const table = document.getElementById("studentTable");

    table.innerHTML = "";

    students.forEach(student => {
        const tr = document.createElement("tr");

        [
            student.id,
            student.student_name,
            student.email,
            student.phone,
            student.department,
            student.year_of_study
        ].forEach(value => {
            const td = document.createElement("td");
            td.textContent = value ?? "";
            tr.appendChild(td);
        });

        const actions = document.createElement("td");

        const editButton = document.createElement("button");
        editButton.textContent = "Edit";
        editButton.className = "btn btn-warning btn-sm me-2";
        editButton.onclick = () => editStudent(student.id);

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "Delete";
        deleteButton.className = "btn btn-danger btn-sm";
        deleteButton.onclick = () => deleteStudent(student.id);

        actions.append(editButton, deleteButton);
        tr.appendChild(actions);
        table.appendChild(tr);
    });
}

document.getElementById("studentForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const id = document.getElementById("studentId").value;

    const data = {
        student_name: document.getElementById("studentName").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value,
        department: document.getElementById("department").value,
        year_of_study: Number(document.getElementById("yearOfStudy").value)
    };

    const response = await fetch(id ? `${API_URL}${id}/` : API_URL, {
        method: id ? "PUT" : "POST",
        credentials: "same-origin",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": getCSRFToken()
        },
        body: JSON.stringify(data)
    });

    const result = await response.json();

    if (!response.ok) {
        showMessage(JSON.stringify(result), "danger");
        return;
    }

    showMessage(id ? "Student updated successfully!" : "Student added successfully!");
    resetForm();
    loadStudents();
});

async function editStudent(id) {
    const response = await fetch(`${API_URL}${id}/`, {
        credentials: "same-origin"
    });

    const student = await response.json();

    document.getElementById("studentId").value = student.id;
    document.getElementById("studentName").value = student.student_name;
    document.getElementById("email").value = student.email;
    document.getElementById("phone").value = student.phone;
    document.getElementById("department").value = student.department;
    document.getElementById("yearOfStudy").value = student.year_of_study;

    document.getElementById("formTitle").textContent = "Edit Student";
    document.getElementById("saveButton").textContent = "Update Student";

    window.scrollTo({ top: 0, behavior: "smooth" });
}

async function deleteStudent(id) {
    if (!confirm("Are you sure you want to delete this student?")) return;

    const response = await fetch(`${API_URL}${id}/`, {
        method: "DELETE",
        credentials: "same-origin",
        headers: {
            "X-CSRFToken": getCSRFToken()
        }
    });

    if (!response.ok) {
        showMessage("Unable to delete student.", "danger");
        return;
    }

    showMessage("Student deleted successfully!");
    loadStudents();
}

function resetForm() {
    document.getElementById("studentForm").reset();
    document.getElementById("studentId").value = "";
    document.getElementById("formTitle").textContent = "Add Student";
    document.getElementById("saveButton").textContent = "Save Student";
}

loadStudents();
</script>

</body>
</html>
