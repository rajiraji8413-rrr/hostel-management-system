
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostel Management Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6f9; }
        .sidebar {
            min-height: 100vh;
            background: #212529;
            padding: 25px 15px;
        }
        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 5px;
        }
        .sidebar a:hover { background: #495057; }
        .dashboard-card {
            border: none;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">

        <!-- SIDEBAR -->
        <div class="col-md-2 sidebar">
            <h4 class="text-white mb-4">Hostel MS</h4>

            <a href="/api/dashboard-page/">Dashboard</a>
            <a href="/api/students-page/">Students</a>
            <a href="/api/rooms-page/">Rooms</a>
            <a href="/api/allocations-page/">Room Allocations</a>
            <a href="/api/payments-page/">Fee Payments</a>
            <a href="/admin/">Admin Panel</a>
        </div>

        <!-- MAIN CONTENT -->
        <div class="col-md-10 p-4">

            <h2 class="mb-4">Hostel Management Dashboard</h2>

            <div class="row g-3">

                <div class="col-md-4">
                    <div class="card dashboard-card shadow-sm p-3">
                        <h6>Total Students</h6>
                        <h2 id="totalStudents">0</h2>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card dashboard-card shadow-sm p-3">
                        <h6>Total Rooms</h6>
                        <h2 id="totalRooms">0</h2>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card dashboard-card shadow-sm p-3">
                        <h6>Active Allocations</h6>
                        <h2 id="totalAllocations">0</h2>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card dashboard-card shadow-sm p-3">
                        <h6>Occupied Beds</h6>
                        <h2 id="occupiedBeds">0</h2>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card dashboard-card shadow-sm p-3">
                        <h6>Available Beds</h6>
                        <h2 id="availableBeds">0</h2>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card dashboard-card shadow-sm p-3">
                        <h6>Total Payments</h6>
                        <h2 id="totalPayments">0</h2>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="card dashboard-card shadow-sm p-3">
                        <h6>Paid Amount</h6>
                        <h2 id="paidAmount">₹0</h2>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="card dashboard-card shadow-sm p-3">
                        <h6>Pending Amount</h6>
                        <h2 id="pendingAmount">₹0</h2>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<script>
async function loadDashboard() {
    try {
        const response = await fetch("/api/dashboard/", {
            credentials: "same-origin"
        });

        if (!response.ok) {
            alert("Please log in through the Admin Panel first.");
            return;
        }

        const data = await response.json();

        document.getElementById("totalStudents").textContent = data.total_students;
        document.getElementById("totalRooms").textContent = data.total_rooms;
        document.getElementById("totalAllocations").textContent = data.total_allocations;
        document.getElementById("occupiedBeds").textContent = data.occupied_beds;
        document.getElementById("availableBeds").textContent = data.available_beds;
        document.getElementById("totalPayments").textContent = data.total_payments;
        document.getElementById("paidAmount").textContent = "₹" + data.paid_amount;
        document.getElementById("pendingAmount").textContent = "₹" + data.pending_amount;

    } catch (error) {
        alert("Unable to load dashboard data.");
        console.error(error);
    }
}

loadDashboard();
</script>

</body>
</html>
